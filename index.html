<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AQI Live India</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <!-- Bootstrap + Leaflet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree@1.0.0/L.Control.Layers.Tree.css" />

  <style>
    :root {
      --primary: #00d9ff;
      --danger: #ff3b30;
      --warning: #ffcc00;
      --success: #34c759;
      --dark: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      text-align: center;
      padding: 30px 0;
      position: relative;
      z-index: 10;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      background: linear-gradient(90deg, #00d9ff, #ff00c8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 20px #00d9ff; }
      to { text-shadow: 0 0 40px #ff00c8, 0 0 60px #00d9ff; }
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .glass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(255,0,200,0.1));
      z-index: -1;
      border-radius: 25px;
    }

    .glass:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 25px 50px rgba(0, 217, 255, 0.3);
    }

    .form-control {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 15px;
      padding: 14px;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.2);
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(0,217,255,0.3);
    }

    .btn-neon {
      background: linear-gradient(45deg, #00d9ff, #ff00c8);
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-weight: 600;
      color: white;
      box-shadow: 0 0 20px rgba(0,217,255,0.5);
      transition: all 0.3s;
    }

    .btn-neon:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0,217,255,0.8);
    }

    #map { height: 500px; border-radius: 25px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

    .stats-card {
      background: var(--glass);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .gauge {
      width: 120px; height: 120px;
      margin: 0 auto;
    }

    .legend {
      display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 20px 0;
    }

    .legend-item {
      display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
    }

    .legend-color {
      width: 16px; height: 16px; border-radius: 50%;
    }

    .search-box {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      width: 300px;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.5rem; }
      .search-box { position: static; width: 100%; margin: 20px 0; }
      #map { height: 400px; }
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="header">
    <h1>AQI LIVE INDIA</h1>
    <p>Real-time Air Quality by Citizens</p>
  </div>

  <div class="container-fluid px-4">

    <!-- Search -->
    <div class="search-box">
      <input type="text" class="form-control" placeholder="Search city..." id="searchCity">
    </div>

    <!-- Stats -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="stats-card glass">
          <h5>Total Reports</h5>
          <h3 id="totalReports">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card glass">
          <h5>Avg AQI</h5>
          <h3 id="avgAQI">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card glass">
          <div class="gauge" id="aqiGauge"></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card glass">
          <button class="btn btn-neon w-100" onclick="shareApp()">
            Share App
          </button>
        </div>
      </div>
    </div>

    <!-- Form + Map -->
    <div class="row">
      <div class="col-lg-4 mb-4">
        <div class="glass">
          <h4 class="text-center mb-4">Report AQI</h4>
          <form id="aqiForm">
            <div class="mb-3">
              <input type="text" class="form-control" id="name" placeholder="Your Name" required>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <input type="number" class="form-control" id="aqi" placeholder="AQI" min="0" max="500" required>
              </div>
              <div class="col-6 mb-3">
                <input type="number" class="form-control" id="pm25" placeholder="PM2.5" required>
              </div>
            </div>
            <div class="mb-3">
              <input type="number" class="form-control" id="pm10" placeholder="PM10" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="address" placeholder="Location" required>
              <button type="button" class="btn btn-outline-light w-100 mt-2" id="getLocation">
                Use My Location
              </button>
            </div>
            <button type="submit" class="btn btn-neon w-100">Submit Report</button>
          </form>
          <div id="message" class="mt-3 text-center"></div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="glass p-3">
          <h4 class="text-center mb-3">Live Pollution Map</h4>
          <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#34c759;"></div> Good</div>
            <div class="legend-item"><div class="legend-color" style="background:#ffcc00;"></div> Moderate</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff9500;"></div> Unhealthy</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff3b30;"></div> Hazardous</div>
          </div>
          <div id="map"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/justgage@1.5.0/justgage.min.js"></script>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx452Bib3ZKUXIlIfQTtCxvNy-z6LLIqyVbqvUd7cZWRefN1oIbFKuKaCGkbJI2fPjj5w/exec';
    let map, markers = L.layerGroup();
    let gauge;

    // Init
    window.onload = () => {
      initMap();
      initGauge();
      loadData();
    };

    function initMap() {
      map = L.map('map').setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      markers.addTo(map);
    }

    function initGauge() {
      gauge = new JustGage({
        id: "aqiGauge",
        value: 0,
        min: 0,
        max: 500,
        title: "Live AQI",
        label: "Index",
        gaugeWidthScale: 0.6,
        levelColors: ["#34c759", "#ffcc00", "#ff9500", "#ff3b30"]
      });
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const { data } = await res.json();
        markers.clearLayers();

        let totalAQI = 0, count = 0;
        data.forEach(p => {
          if (p.lat && p.lng) {
            const marker = L.circleMarker([p.lat, p.lng], {
              radius: 12,
              fillColor: getColor(p.aqi),
              color: '#000',
              weight: 2,
              fillOpacity: 0.9
            }).addTo(markers);
            marker.bindPopup(`<b>${p.city}</b><br>${p.name}<br>AQI: ${p.aqi}`);
            totalAQI += parseInt(p.aqi); count++;
          }
        });

        document.getElementById('totalReports').textContent = count;
        document.getElementById('avgAQI').textContent = count ? Math.round(totalAQI/count) : 0;
        gauge.refresh(count ? Math.round(totalAQI/count) : 0);

      } catch (err) { console.error(err); }
    }

    function getColor(aqi) {
      aqi = parseInt(aqi);
      if (aqi <= 50) return '#34c759';
      if (aqi <= 100) return '#ffcc00';
      if (aqi <= 200) return '#ff9500';
      return '#ff3b30';
    }

    function shareApp() {
      const text = "Check live AQI in India! Report your area now!";
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: "AQI Live", text, url });
      } else {
        prompt("Share this link:", url);
      }
    }

    // Form, Location, etc. (same as before)
    // ... (tu chahe to add kar sakta hai)

    setInterval(loadData, 300000);
  </script>
</body>
</html>
